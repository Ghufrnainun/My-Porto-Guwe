<!doctype html>
<!-- The share card (public/og-image.png). Rendered by scripts/build-og-image.mjs; open it in a browser at 1200x630 to edit. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=block"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        font-family: 'Plus Jakarta Sans', sans-serif;
        color: #14131a;
        background: #e9ecf5;
      }
      /* the desktop's own wallpaper, blurred, as the card's ground */
      .ground {
        position: absolute;
        inset: -80px;
        background: url(ganos-desktop.jpg) 70% 60% / cover;
        filter: blur(48px) saturate(1.15);
      }
      .veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(246, 246, 250, 0.86) 0%, rgba(246, 246, 250, 0.66) 42%, rgba(246, 246, 250, 0.1) 70%);
      }
      .shot {
        position: absolute;
        left: 548px;
        top: 56px;
        width: 1010px;
        border-radius: 16px;
        box-shadow: 0 0 0 1px rgba(20, 19, 26, 0.14), 0 30px 70px -10px rgba(40, 30, 80, 0.45);
      }
      .copy { position: absolute; left: 72px; top: 72px; bottom: 64px; width: 450px; display: flex; flex-direction: column; }
      .brand { display: flex; align-items: center; gap: 12px; font: 500 15px 'JetBrains Mono', monospace; letter-spacing: 0.06em; color: #4b4856; }
      .brand img { height: 30px; }
      h1 { margin-top: 64px; font-size: 68px; line-height: 1; font-weight: 800; letter-spacing: -0.04em; }
      .role { margin-top: 22px; font-size: 26px; font-weight: 600; letter-spacing: -0.015em; color: #2b2935; }
      .note { margin-top: 12px; font-size: 19px; font-weight: 500; line-height: 1.4; color: #5a5766; }
      .url { margin-top: auto; display: flex; align-items: center; gap: 10px; font: 500 18px 'JetBrains Mono', monospace; color: #14131a; }
      .url::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #d97736; }
    </style>
  </head>
  <body>
    <div class="ground"></div>
    <div class="veil"></div>
    <img class="shot" src="ganos-desktop.jpg" alt="" />
    <div class="copy">
      <div class="brand"><img src="../../public/brand-logo.svg" alt="" />GanOS</div>
      <h1>Ghufron<br />Ainun Najib</h1>
      <p class="role">Full-stack &amp; mobile developer</p>
      <p class="note">A portfolio you use like a desktop.</p>
      <p class="url">ghufronainun.tech</p>
    </div>
  </body>
</html>
