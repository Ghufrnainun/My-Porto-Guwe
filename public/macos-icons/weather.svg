<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="weatherBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1ea0f2" />
      <stop offset="55%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeb3b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Sun Glow Filter -->
    <filter id="sunGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Cloud Front Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Cloud Shadow -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- macOS Squircle Body -->
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#weatherBg)" />
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" />

  <!-- Sun -->
  <circle cx="82" cy="46" r="22" fill="url(#sunGrad)" filter="url(#sunGlow)" />

  <!-- Cloud Body -->
  <g filter="url(#cloudShadow)">
    <path
      d="M38 88 h54 a17 17 0 0 0 4 -33.5 a25 25 0 0 0 -44 -12 a18 18 0 0 0 -22 17.5 a18 18 0 0 0 8 28 z"
      fill="url(#cloudGrad)"
    />
  </g>
</svg>
