    <!-- Single unified GanOS boot preloader: renders at t=0ms and hands off seamlessly to AppPreloader -->
    <div
      id="boot-splash"
      data-nosnippet
      role="status"
      aria-live="polite"
      aria-label="Loading portfolio"
    >
      <style>
        #boot-splash {
          position: fixed;
          inset: 0;
          z-index: 10000;
          background: #09090b;
          color: #f5f5f7;
          font-family:
            'Plus Jakarta Sans',
            'Inter',
            -apple-system,
            BlinkMacSystemFont,
            system-ui,
            sans-serif;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          user-select: none;
          -webkit-user-select: none;
          -webkit-font-smoothing: antialiased;
          transition:
            opacity 240ms cubic-bezier(0.23, 1, 0.32, 1),
            transform 240ms cubic-bezier(0.23, 1, 0.32, 1);
          will-change: opacity, transform;
        }
        #boot-splash .boot-ambient {
          position: absolute;
          inset: 0;
          pointer-events: none;
          background: radial-gradient(
            ellipse 540px 360px at 50% 44%,
            rgba(255, 255, 255, 0.035) 0%,
            transparent 70%
          );
        }
        #boot-splash .boot-stage {
          position: relative;
          z-index: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          padding: 0 24px;
          transition:
            opacity 200ms cubic-bezier(0.23, 1, 0.32, 1),
            transform 220ms cubic-bezier(0.23, 1, 0.32, 1);
        }
        #boot-splash.is-exiting .boot-stage {
          opacity: 0;
          transform: translateY(-5px);
        }
        #boot-splash .boot-logo {
          width: 28px;
          height: 23px;
          opacity: 0;
          animation: bootLogoIn 320ms cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }
        #boot-splash .boot-greeting {
          margin: 16px 0 0;
          font-size: clamp(22px, 3.2vw, 30px);
          font-weight: 450;
          letter-spacing: -0.025em;
          line-height: 1.25;
          color: rgba(245, 245, 247, 0.94);
          opacity: 0;
          animation: bootGreetingIn 400ms cubic-bezier(0.23, 1, 0.32, 1) 70ms forwards;
        }
        #boot-splash .boot-city {
          display: inline;
          opacity: 0;
          transition: opacity 280ms cubic-bezier(0.23, 1, 0.32, 1);
        }
        #boot-splash .boot-city.is-visible {
          opacity: 1;
        }
        #boot-splash .boot-sub {
          margin: 10px 0 0;
          font-size: 12px;
          font-weight: 400;
          letter-spacing: 0.01em;
          color: rgba(245, 245, 247, 0.38);
          opacity: 0;
          animation: bootSubIn 360ms cubic-bezier(0.23, 1, 0.32, 1) 150ms forwards;
        }
        @keyframes bootLogoIn {
          from {
            opacity: 0;
            transform: translateY(4px);
          }
          to {
            opacity: 0.78;
            transform: translateY(0);
          }
        }
        @keyframes bootGreetingIn {
          from {
            opacity: 0;
            transform: translateY(6px);
            filter: blur(4px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
          }
        }
        @keyframes bootSubIn {
          from {
            opacity: 0;
            transform: translateY(4px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #boot-splash .boot-logo,
          #boot-splash .boot-greeting,
          #boot-splash .boot-sub {
            animation: none;
            filter: none;
            transform: none;
          }
          #boot-splash .boot-logo {
            opacity: 0.78;
          }
          #boot-splash .boot-greeting,
          #boot-splash .boot-sub {
            opacity: 1;
          }
        }
      </style>

    <!-- /boot-splash -->
    <script>
      (function () {
        try {
          if (
            sessionStorage.getItem('portfolio_booted') === 'true' ||
            location.pathname !== '/'
          ) {
            var s = document.getElementById('boot-splash');
            if (s) s.remove();
            return;
          }
          var h = new Date().getHours();
          var g = h >= 5 && h < 12 ? 'Good morning' : h >= 12 && h < 17 ? 'Good afternoon' : 'Good evening';
          var gEl = document.getElementById('boot-splash-greeting');
          if (gEl) gEl.textContent = g;

          var cEl = document.getElementById('boot-splash-city');
          var setCity = function (city) {
            if (!city || !cEl) return;
            cEl.textContent = ' in ' + city;
            cEl.classList.add('is-visible');
          };

          var cached = sessionStorage.getItem('ganos_visitor_city');
          if (cached) {
            setCity(cached);
          } else {
            var tzCity = '';
            try {
              var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
              var parts = tz.split('/');
              if (parts.length >= 2 && parts[0] !== 'Etc') {
                tzCity = parts[parts.length - 1].replace(/_/g, ' ');
              }
            } catch (e) {}

            var settled = false;
            var fallbackTimer = setTimeout(function () {
              if (!settled && tzCity) {
                setCity(tzCity);
              }
            }, 340);

            if (typeof fetch === 'function') {
              var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
              if (ctrl) setTimeout(function () { ctrl.abort(); }, 650);
              fetch('https://get.geojs.io/v1/ip/geo.json', ctrl ? { signal: ctrl.signal } : undefined)
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (d) {
                  var city = d && typeof d.city === 'string' ? d.city.trim() : '';
                  if (city) {
                    settled = true;
                    clearTimeout(fallbackTimer);
                    try { sessionStorage.setItem('ganos_visitor_city', city); } catch (e) {}
                    setCity(city);
                  }
                })
                .catch(function () {});
            }
          }
        } catch (e) {}
      })();
    </script>
